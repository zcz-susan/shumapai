    <!-- ======================== 上半部分：排行榜表格 ======================== -->
    <!-- 容器带横向滚动，手机上也能看全九列 -->
    <div class="rate-table-wrap">
      <table class="rate-table" id="rateTable">
        <thead>
          <tr>
            <th>排名</th>
            <th>机型</th>
            <th>价格</th>
            <!-- 带data-key的表头可点击排序，data-label存原始文字供渲染箭头用 -->
            <th class="sortable" data-key="perf" data-label="性能">性能</th>
            <th class="sortable" data-key="screen" data-label="屏幕">屏幕</th>
            <th class="sortable" data-key="camera" data-label="影像">影像</th>
            <th class="sortable" data-key="battery" data-label="续航">续航</th>
            <th class="sortable" data-key="value" data-label="性价比">性价比</th>
            <th class="sortable" data-key="total" data-label="总分">总分</th>
          </tr>
        </thead>
        <tbody id="rateTableBody"><!-- rate.js 渲染 --></tbody>
      </table>
    </div>

    <!-- ======================== 下半部分：逐机点评卡片 ======================== -->
    <section class="section">
